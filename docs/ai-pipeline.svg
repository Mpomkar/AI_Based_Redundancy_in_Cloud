<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="520" fill="url(#bg)" rx="12"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">AI Redundancy Detection Pipeline</text>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#64748b">Upload ’ Similarity ’ ML ’ Decision ’ Risk Score</text>

  <!-- Upload -->
  <rect x="40" y="80" width="140" height="56" rx="8" fill="#2563eb" filter="url(#shadow)"/>
  <text x="80" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">File Upload</text>

  <!-- SHA-256 -->
  <rect x="220" y="80" width="140" height="56" rx="8" fill="#0f766e" filter="url(#shadow)"/>
  <text x="270" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">SHA-256 Hash</text>
  <text x="270" y="120" text-anchor="middle" font-size="10" fill="#ccfbf1">Exact duplicate?</text>

  <!-- Reject duplicate -->
  <rect x="400" y="40" width="130" height="48" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <text x="465" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Reject Duplicate</text>

  <!-- Similarity branch -->
  <rect x="400" y="110" width="130" height="56" rx="8" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="465" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Similarity Scan</text>
  <text x="465" y="150" text-anchor="middle" font-size="9" fill="#ede9fe">Jaccard / pHash</text>

  <!-- Features -->
  <rect x="560" y="110" width="140" height="56" rx="8" fill="#d97706" filter="url(#shadow)"/>
  <text x="630" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Feature Vector</text>
  <text x="630" y="150" text-anchor="middle" font-size="9" fill="#fef3c7">3 numeric inputs</text>

  <!-- ML -->
  <rect x="720" y="110" width="160" height="56" rx="8" fill="#1d4ed8" filter="url(#shadow)"/>
  <text x="800" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Logistic Regression</text>
  <text x="800" y="146" text-anchor="middle" font-size="9" fill="#dbeafe">ML redundancy probability</text>

  <!-- Decision -->
  <rect x="560" y="210" width="200" height="56" rx="8" fill="#475569" filter="url(#shadow)"/>
  <text x="660" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Policy + ML Rules</text>
  <text x="660" y="250" text-anchor="middle" font-size="9" fill="#e2e8f0">e92% match OR ML threshold</text>

  <!-- Outcomes -->
  <rect x="400" y="300" width="130" height="48" rx="8" fill="#16a34a" filter="url(#shadow)"/>
  <text x="465" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Stored</text>

  <rect x="560" y="300" width="130" height="48" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <text x="605" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Rejected</text>

  <!-- Risk -->
  <rect x="720" y="300" width="160" height="48" rx="8" fill="#0891b2" filter="url(#shadow)"/>
  <text x="800" y="328" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Risk Score 0100%</text>

  <!-- Arrows -->
  <path d="M180 108 L220 108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 108 L400 64" stroke="#64748b" stroke-width="2"/>
  <path d="M360 108 L400 138" stroke="#64748b" stroke-width="2"/>
  <path d="M530 138 L560 138" stroke="#64748b" stroke-width="2"/>
  <path d="M700 138 L720 138" stroke="#64748b" stroke-width="2"/>
  <path d="M800 166 L800 210 L660 210" stroke="#64748b" stroke-width="2"/>
  <path d="M660 266 L465 300" stroke="#64748b" stroke-width="2"/>
  <path d="M660 266 L605 300" stroke="#64748b" stroke-width="2"/>
  <path d="M760 266 L800 300" stroke="#64748b" stroke-width="2"/>

  <!-- Legend boxes -->
  <rect x="40" y="200" width="280" height="150" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="222" font-size="12" font-weight="700" fill="#1e293b">Documents (PDF / DOCX)</text>
  <text x="60" y="242" font-size="11" fill="#475569">" Extract text from file</text>
  <text x="60" y="258" font-size="11" fill="#475569">" Jaccard word overlap vs stored files</text>
  <text x="60" y="278" font-size="12" font-weight="700" fill="#1e293b">Images (JPEG / PNG / &)</text>
  <text x="60" y="298" font-size="11" fill="#475569">" Perceptual hash (pHash)</text>
  <text x="60" y="318" font-size="11" fill="#475569">" Hamming distance ’ similarity score</text>
  <text x="60" y="342" font-size="11" fill="#475569">" difflib guidance for near-duplicates</text>

  <rect x="40" y="370" width="860" height="100" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="60" y="398" font-size="12" font-weight="700" fill="#1e293b">ML Features ’ Logistic Regression</text>
  <text x="60" y="420" font-size="11" fill="#475569">1. max_similarity  best content match (01)</text>
  <text x="60" y="438" font-size="11" fill="#475569">2. size_ratio  smaller file size ÷ larger file size</text>
  <text x="60" y="456" font-size="11" fill="#475569">3. neighbor_frequency  count of similar files (e55%) capped at 5</text>
  <text x="480" y="420" font-size="11" fill="#475569">Model: scikit-learn Pipeline (StandardScaler + LogisticRegression)</text>
  <text x="480" y="438" font-size="11" fill="#475569">Trained on synthetic data at first startup (see trainer.py)</text>
  <text x="480" y="456" font-size="11" fill="#475569">Output: redundant probability ’ combined with policy for final decision</text>
</svg>
